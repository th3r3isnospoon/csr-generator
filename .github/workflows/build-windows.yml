name: Test and package

on:
  push:
    branches: [main, 'modernization/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
        python: ['3.11', '3.12', '3.13', '3.14']
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: b48dec7aed2a254013a92636f641fb30a43334e2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - name: Require external OpenSSL for integration checks
        run: openssl version
      - run: python -m unittest discover -v
      - name: Linux Tk tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a env CSR_GUI_TESTS=1 python -m unittest tests.test_gui -v
      - name: Windows and macOS Tk tests
        if: runner.os != 'Linux'
        env:
          CSR_GUI_TESTS: '1'
        run: python -m unittest tests.test_gui -v
  package:
    needs: test
    strategy:
      matrix:
        os: [windows-2022]
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: b48dec7aed2a254013a92636f641fb30a43334e2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - name: Build and test Linux CLI and GUI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a python scripts/build.py --gui-smoke
      - name: Build and test Windows CLI and GUI
        if: runner.os == 'Windows'
        run: python scripts/build.py --gui-smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: csr-generator-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
# Intentionally no release publication or write token. Tags produce artifacts only.
